services:
  clickhouse:
    image: altinity/clickhouse-server:25.3.8.10042.altinitystable
    container_name: clickhouse
    restart: unless-stopped

    ports:
      - "8123:8123"
      - "9002:9000"

    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "default"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password default --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 60

  clickhouse-init-ice:
    image: altinity/clickhouse-server:25.3.8.10042.altinitystable
    container_name: clickhouse-init-ice
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
    entrypoint: []
    command:
      - /bin/bash
      - -ceu
      - |
        clickhouse-client \
          --host=clickhouse \
          --port=9000 \
          --user=default \
          --password=default \
          --multiquery "
            SET allow_experimental_database_iceberg = 1;

            CREATE DATABASE IF NOT EXISTS ice
            ENGINE = DataLakeCatalog('http://ice-rest-catalog:5000')
            SETTINGS
                auth_header = 'Authorization: Bearer foo',
                storage_endpoint = 'http://ice-rest-catalog:9000',
                warehouse = 's3://bucket1';
          "

volumes:
  clickhouse_data:
