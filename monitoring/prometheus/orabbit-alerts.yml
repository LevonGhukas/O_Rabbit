# Prometheus alert rules for the O_Rabbit master's lifecycle metrics
# (GET /metrics on the master's HTTP port; only the active leader serves it).
#
# severity: critical pages someone; severity: warning opens a ticket.
# Every rule waits ("for") longer than the retries and lease scans it watches
# normally take, so brief, expected retries never alert. Defaults it assumes:
# ORABBIT_REGISTRATION_TIMEOUT 30m, lease durations 30s, lease scans <= 5s.
# Validate with: promtool check rules orabbit-alerts.yml
#                promtool test rules orabbit-alerts.test.yml
groups:
  - name: orabbit-registration
    rules:
      - alert: OrabbitCatalogAttemptStuck
        # One catalog attempt has been active for longer than the registration
        # timeout (30m) plus margin: the timeout did not end it.
        expr: max(orabbit_oldest_registration_attempt_age_seconds) > 2700
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A catalog registration attempt is stuck
          description: The oldest active Iceberg registration attempt has run for more than 45 minutes; later registrations of its dataset cannot proceed.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitcatalogattemptstuck

      - alert: OrabbitRegistrationQueueStalled
        # Pending registrations normally start within seconds.
        expr: max(orabbit_oldest_registration_age_seconds{status="PENDING"}) > 1800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Registrations are waiting too long
          description: A registration has been PENDING for more than 30 minutes.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitregistrationqueuestalled

      - alert: OrabbitRegistrationQueueBlocked
        expr: max(orabbit_oldest_registration_age_seconds{status="PENDING"}) > 7200
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The registration queue is blocked
          description: A registration has been PENDING for more than 2 hours; new data is not reaching the Iceberg tables.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitregistrationqueueblocked

      - alert: OrabbitRegistrationReconcilingSustained
        expr: max(orabbit_oldest_registration_age_seconds{status="RECONCILING"}) > 1800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A registration has been reconciling for too long
          description: A registration has been RECONCILING for more than 30 minutes; the catalog outcome of an earlier attempt is still unknown.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitregistrationreconcilingsustained

      - alert: OrabbitRegistrationRetrySustained
        # Retries back off for minutes at most; an hour means they keep failing.
        expr: max(orabbit_oldest_registration_age_seconds{status="RETRY_REQUIRED"}) > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A registration keeps retrying
          description: A registration has been waiting to retry for more than an hour.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitregistrationretrysustained

      - alert: OrabbitRegistrationBlocked
        expr: max(orabbit_registrations_blocked) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Registrations are blocked behind an earlier failure
          description: At least one registration is BLOCKED by an earlier registration of the same dataset that needs operator action.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitregistrationblocked

      - alert: OrabbitRegistrationLeaseExpired
        # The expiry scan clears expired leases within seconds.
        expr: max(orabbit_registration_attempt_leases_expired) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Expired registration leases are not being cleared
          description: An active registration attempt has an expired lease for more than 5 minutes.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitregistrationleaseexpired

      - alert: OrabbitOperatorActionRequired
        expr: max(orabbit_runs_operator_action_required) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A run needs operator action
          description: At least one run is flagged operator_action_required.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitoperatoractionrequired

      - alert: OrabbitRegistrationFailures
        # Failed and quarantined registrations stay counted until history is
        # pruned, so alert on new ones.
        expr: sum(delta(orabbit_registrations{status=~"FAILED|QUARANTINED"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Registrations failed recently
          description: At least one Iceberg registration became FAILED or QUARANTINED in the last 30 minutes.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitregistrationfailures

      - alert: OrabbitReconciliationRetryExhausted
        expr: sum(delta(orabbit_reconciliations_by_classification{classification="RETRY_LIMIT_EXHAUSTED"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: A catalog reconciliation ran out of retries
          description: At least one reconciliation reached RETRY_LIMIT_EXHAUSTED in the last 30 minutes.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitreconciliationretryexhausted

      - alert: OrabbitCatalogCapacityFull
        expr: max(orabbit_catalog_work_slots_in_use) >= max(orabbit_catalog_work_slots_capacity) and max(orabbit_catalog_work_slots_capacity) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Every catalog work slot has been busy for 15 minutes
          description: Registrations and reconciliations are waiting for catalog work slots.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitcatalogcapacityfull

  - name: orabbit-runs
    rules:
      - alert: OrabbitCommittingRunTooOld
        # Age counts from the run's start, so it includes extraction time;
        # the threshold leaves room for long exports plus commit retries.
        expr: max(orabbit_oldest_committing_run_age_seconds) > 21600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: A run has been committing for too long
          description: The oldest COMMITTING run started more than 6 hours ago and has not finished publishing.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitcommittingruntooold

      - alert: OrabbitCommitRetrySustained
        expr: max(orabbit_commit_reconciliation_runs{outcome="retry_required"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Run commits keep retrying
          description: At least one run has needed a commit retry for 30 minutes.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitcommitretrysustained

      - alert: OrabbitTaskLeaseExpired
        expr: max(orabbit_task_leases_expired) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Expired task leases are not being cleared
          description: An active task attempt has had an expired lease for more than 5 minutes.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbittaskleaseexpired

  - name: orabbit-leadership
    rules:
      - alert: OrabbitNoActiveLeader
        # Only the leader serves /metrics, so a missing series also means no
        # leader (or no reachable master).
        expr: absent(orabbit_leadership_active == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No O_Rabbit master is the active leader
          description: No scraped master reports active leadership; runs, commits and registrations are stopped.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitnoactiveleader

      - alert: OrabbitLeadershipFlapping
        expr: changes(max(orabbit_leadership_epoch)[30m:1m]) > 2
        labels:
          severity: warning
        annotations:
          summary: Master leadership keeps changing
          description: Leadership changed more than twice in 30 minutes.
          runbook_url: https://github.com/LevonGhukas/O_Rabbit/blob/main/docs/runbooks.md#orabbitleadershipflapping
