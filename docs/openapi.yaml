openapi: 3.1.0
info:
  title: O_Rabbit master API
  version: "1"
  description: |
    Versioned HTTP API of the O_Rabbit master. Every resource is served under
    `/api/v1`. The older unversioned paths (`/runs`, `/jobs`, `/connections`,
    `/workers`, `/servers`, `/deployments`, `/executions`, `/sse`, `/api/runs`,
    `/api/jobs`, `/api/workers`, `/api/source-engines`, `/api/maintenance/submit`)
    still work but are deprecated: their responses carry `Deprecation: true` and
    a `Link: <...>; rel="successor-version"` header naming the `/api/v1` path.

    Operational endpoints are not versioned: `/healthz`, `/ready`, `/metrics`,
    `/status`.

    Authentication: when `ORABBIT_HTTP_AUTH_TOKEN` is set, every request needs
    `Authorization: Bearer <token>`. Remote operations (`/servers`,
    `/deployments`, `/executions`) are disabled unless enabled, and then accept
    only their own token, never the API token.

    Bodies of the larger resources (jobs, connections, remote operations) are
    described in README.md; this spec covers their paths and the run API in detail.
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /source-engines:
    get:
      summary: Source engines and what each can do
      responses:
        "200":
          description: One entry per registered engine
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceEngine" }
  /runs/validate:
    post:
      summary: Validate a one-shot run without creating anything
      requestBody: { $ref: "#/components/requestBodies/RunSubmit" }
      responses:
        "200": { description: Valid; includes type mappings and warnings }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /runs/submit:
    post:
      summary: Submit a one-shot run (connection, job and run in one call)
      requestBody: { $ref: "#/components/requestBodies/RunSubmit" }
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSubmitted" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /runs:
    get:
      summary: List runs (newest first)
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of runs; the next page cursor is in X-Next-Cursor
          headers:
            X-Next-Cursor: { schema: { type: string } }
  /runs/{run_id}:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      summary: A run and its tasks
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  tasks: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/Error" }
  /runs/{run_id}/events:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      summary: Run events, paged by cursor
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Events and the next cursor }
  /runs/{run_id}/events/stream:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      summary: Run events as Server-Sent Events
      responses:
        "200": { description: text/event-stream }
  /runs/{run_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post:
      summary: Cancel a run
      responses:
        "200": { description: Cancel accepted }
  /runs/{run_id}/progress:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get: { summary: Run progress, responses: { "200": { description: Progress } } }
  /runs/{run_id}/artifacts:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get: { summary: Files written by the run, responses: { "200": { description: Artifacts } } }
  /runs/{run_id}/diagnosis:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    get:
      summary: Diagnosis of a stuck or failed run
      responses:
        "200":
          description: Diagnosis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDiagnosis" }
  /runs/{run_id}/recover:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post: { summary: Operator recovery action, responses: { "200": { description: Recovery result } } }
  /runs/{run_id}/registration/retry:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post:
      summary: Retry Iceberg registration, optionally with a new config
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                override_config: { type: boolean }
                config_yaml: { type: string }
      responses:
        "200": { description: Retry scheduled }
  /runs/{run_id}/registration/cancel:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post: { summary: Cancel Iceberg registration, responses: { "200": { description: Canceled } } }
  /jobs:
    get: { summary: List jobs, responses: { "200": { description: Jobs } } }
    post:
      summary: Create a job
      description: &jobValidation >-
        The job is validated before it is stored: `name` is required,
        `source_connection_id` and `target_connection_id` must name existing
        source and target connections, and `options_json` must be an object
        (or null) with known keys of the right type and valid values.
        `write_mode` must be `overwrite` (full jobs, the default) or `append`
        (incremental jobs, the default); `incremental` + `overwrite` and full
        + `append` are rejected.
        Unknown keys are rejected with a "did you mean" hint. Invalid jobs get
        400 `invalid_input` listing every problem in `details.errors`
        (`[{field, error}]`), and nothing is stored.
      responses:
        "201": { description: Job }
        "400": { $ref: "#/components/responses/Error" }
  /jobs/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    get: { summary: A job, responses: { "200": { description: Job } } }
    put:
      summary: Update a job
      description: *jobValidation
      responses:
        "200": { description: Job }
        "400": { $ref: "#/components/responses/Error" }
    delete: { summary: Delete a job, responses: { "204": { description: Deleted } } }
  /jobs/{job_id}/runs:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    post:
      summary: Start a run of an existing job
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_config: { type: object }
      responses:
        "201": { description: "{run, tasks}" }
        "422":
          description: >-
            Planning failed for a reason the caller must fix. A job stored with
            invalid options_json or an unsafe write_mode returns failure_class
            CONFIGURATION_INVALID and lists every problem in `details.errors`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /connections:
    get: { summary: List connections (secrets redacted), responses: { "200": { description: Connections } } }
    post: { summary: Create a connection, responses: { "201": { description: Connection } } }
  /connections/{connection_id}:
    parameters: [{ name: connection_id, in: path, required: true, schema: { type: string } }]
    get: { summary: A connection, responses: { "200": { description: Connection } } }
    put: { summary: Update a connection, responses: { "200": { description: Connection } } }
    delete: { summary: Delete a connection, responses: { "204": { description: Deleted } } }
  /workers:
    get:
      summary: Workers (active only unless all=1)
      parameters: [{ name: all, in: query, schema: { type: string, enum: ["1"] } }]
      responses:
        "200":
          description: Workers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Worker" } }
  /workers/{worker_id}:
    parameters: [{ name: worker_id, in: path, required: true, schema: { type: string } }]
    get: { summary: Worker identity and enrollment routes (see README), responses: { "200": { description: Worker } } }
  /events:
    get:
      summary: Run, task and job events across all runs, newest first (log viewer). Messages and fields are masked.
      parameters:
        - { $ref: "#/components/parameters/LogLevel" }
        - { $ref: "#/components/parameters/LogQuery" }
        - { $ref: "#/components/parameters/LogSince" }
        - { $ref: "#/components/parameters/LogUntil" }
        - { $ref: "#/components/parameters/LogBefore" }
        - { $ref: "#/components/parameters/LogLimit" }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: job_id, in: query, schema: { type: string } }
        - { name: task_id, in: query, schema: { type: string } }
        - { name: worker_id, in: query, schema: { type: string } }
        - { name: count, in: query, description: "1 adds total (capped at 10000, see total_capped)", schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: "{items, next_before, total?, total_capped?}; pass next_before as before for the next older page" }
        "400": { $ref: "#/components/responses/Error" }
  /events/stream:
    get:
      summary: New matching events as Server-Sent Events (event "log", id = seq). Resumes from Last-Event-ID or after.
      parameters:
        - { $ref: "#/components/parameters/LogLevel" }
        - { $ref: "#/components/parameters/LogQuery" }
        - { name: after, in: query, schema: { type: integer } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: job_id, in: query, schema: { type: string } }
        - { name: task_id, in: query, schema: { type: string } }
        - { name: worker_id, in: query, schema: { type: string } }
      responses:
        "200": { description: text/event-stream }
        "503": { description: Too many live log viewers }
  /logs/master:
    get:
      summary: Recent master log records from an in-memory buffer (10000 records), newest first, masked
      parameters:
        - { $ref: "#/components/parameters/LogLevel" }
        - { $ref: "#/components/parameters/LogQuery" }
        - { $ref: "#/components/parameters/LogSince" }
        - { $ref: "#/components/parameters/LogUntil" }
        - { $ref: "#/components/parameters/LogBefore" }
        - { $ref: "#/components/parameters/LogLimit" }
      responses:
        "200": { description: "{items, total, next_before, capacity}" }
        "503": { description: Log buffer not enabled }
  /logs/master/stream:
    get:
      summary: New master log records as Server-Sent Events (event "log", id = seq)
      parameters:
        - { $ref: "#/components/parameters/LogLevel" }
        - { $ref: "#/components/parameters/LogQuery" }
        - { name: after, in: query, schema: { type: integer } }
      responses:
        "200": { description: text/event-stream }
        "503": { description: Too many live log viewers, or log buffer not enabled }
  /maintenance/submit:
    post: { summary: Submit Iceberg maintenance, responses: { "201": { description: Maintenance run } } }
  /sse:
    get:
      summary: Run events as Server-Sent Events (by run_id)
      parameters: [{ name: run_id, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: text/event-stream } }
  /servers:
    get: { summary: "Remote operations: servers", security: [{ remoteOps: [] }], responses: { "200": { description: Servers } } }
  /servers/{server_id}:
    parameters: [{ name: server_id, in: path, required: true, schema: { type: string } }]
    get: { summary: "Remote operations: a server", security: [{ remoteOps: [] }], responses: { "200": { description: Server } } }
  /deployments:
    get: { summary: "Remote operations: deployments", security: [{ remoteOps: [] }], responses: { "200": { description: Deployments } } }
    post:
      summary: "Remote operations: deploy master, worker or MinIO on a registered server"
      security: [{ remoteOps: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentRequest" }
      responses:
        "202": { description: Deployment started; follow events_stream_url }
        "400": { $ref: "#/components/responses/Error" }
  /deployments/{deployment_id}:
    parameters: [{ name: deployment_id, in: path, required: true, schema: { type: string } }]
    get: { summary: "Remote operations: a deployment", security: [{ remoteOps: [] }], responses: { "200": { description: Deployment } } }
  /executions/{execution_id}:
    parameters: [{ name: execution_id, in: path, required: true, schema: { type: string } }]
    get: { summary: "Remote operations: an execution", security: [{ remoteOps: [] }], responses: { "200": { description: Execution } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: ORABBIT_HTTP_AUTH_TOKEN }
    remoteOps: { type: http, scheme: bearer, description: The separate remote-operations token }
  parameters:
    RunID: { name: run_id, in: path, required: true, schema: { type: string } }
    JobID: { name: job_id, in: path, required: true, schema: { type: string } }
    LogLevel: { name: level, in: query, description: "Repeatable or comma-separated: DEBUG, INFO, WARN (WARNING), ERROR, CRITICAL", schema: { type: string } }
    LogQuery: { name: q, in: query, description: Case-insensitive substring of the message or fields (max 200 chars), schema: { type: string } }
    LogSince: { name: since, in: query, schema: { type: string, format: date-time } }
    LogUntil: { name: until, in: query, schema: { type: string, format: date-time } }
    LogBefore: { name: before, in: query, description: Sequence number; returns older entries, schema: { type: integer } }
    LogLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
  requestBodies:
    RunSubmit:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RunSubmitRequest" }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    SourceEngine:
      type: object
      required: [engine, table_mode_supported, ordered_cursor_supported, query_supported]
      properties:
        engine: { type: string }
        table_mode_supported:
          type: boolean
          description: Tables can be extracted (as one task when there is no ordered cursor).
        ordered_cursor_supported:
          type: boolean
          description: Tables can be split and read incrementally by an ordered cursor column.
        query_supported: { type: boolean }
        query_languages: { type: array, items: { type: string } }
        query_incremental_supported: { type: boolean }
        query_schema_inference_supported: { type: boolean }
        oneshot_submit_supported: { type: boolean, description: Accepted by /runs/submit. }
        frontend_submit_supported: { type: boolean, deprecated: true, description: Old name of oneshot_submit_supported. }
    RunSubmitRequest:
      type: object
      required: [source, target]
      properties:
        source:
          type: object
          required: [engine, dsn]
          properties:
            engine: { type: string }
            dsn: { type: string, description: Source connection string or s3:// URI. Never logged. }
            mode: { type: string, enum: [table, query] }
            table: { type: string }
            query: { type: string }
            cursor_column: { type: string }
            incremental:
              type: boolean
              description: >-
                Resume after the committed high-water mark. Exports inserts and
                updates that move the cursor; source deletes are not
                propagated, so run a full refresh (incremental false) to remove
                deleted rows.
            where_clause: { type: string }
            select_columns: { type: array, items: { type: string } }
            column_types: { type: object, additionalProperties: { type: string } }
            record_path: { type: string }
            format: { type: string }
        target:
          type: object
          properties:
            s3_endpoint: { type: string }
            s3_region: { type: string }
            s3_bucket: { type: string }
            s3_prefix: { type: string }
            s3_force_path_style: { type: boolean }
            s3_access_key_id: { type: string }
            s3_secret_access_key: { type: string }
        performance:
          type: object
          properties:
            auto_tune: { type: boolean }
            max_in_flight_tasks: { type: integer }
            planned_tasks: { type: integer }
            target_rows_per_task: { type: integer }
            target_file_bytes: { type: integer }
        iceberg:
          type: object
          properties:
            enabled: { type: boolean }
            engine: { type: string, enum: [rest-go, ice] }
            table: { type: string }
            config_yaml: { type: string }
            options: { type: object }
            partition_keys: { type: array, items: { type: string } }
        consistency:
          type: object
          properties:
            mode:
              type: string
              enum: [EVENTUAL, STRONG_SNAPSHOT]
              default: EVENTUAL
              description: STRONG_CDC is rejected; change data capture is not supported yet.
        worker_pool: { type: string }
        reconciliation:
          $ref: "#/components/schemas/Reconciliation"
    Reconciliation:
      type: object
      description: >
        Optional commit-time check that counts the planned source range and
        compares it with the rows written. Needs ordered_cursor and a SQL
        engine that can count (postgres, mysql, mariadb, mssql, oracle,
        clickhouse, trino). Also accepted as options_json.reconciliation.
      properties:
        mode: { type: string, enum: [off, count], default: off }
        consistency:
          type: string
          enum: [none, immutable]
          default: none
          description: immutable asserts the source range does not change during the run, so a difference is proven data loss.
        on_mismatch: { type: string, enum: [fail, review], default: fail }
    SourceReconciliationResult:
      type: object
      properties:
        run_id: { type: string }
        task_id: { type: string }
        method: { type: string, enum: [count] }
        consistency: { type: string, enum: [none, immutable] }
        observed_at: { type: string }
        lower_bound: { type: string }
        lower_exclusive: { type: boolean }
        upper_bound: { type: string }
        upper_inclusive: { type: boolean }
        source_rows: { type: integer }
        output_rows: { type: integer }
        status: { type: string, enum: [match, mismatch, indeterminate, error] }
        detail: { type: string }
    RunDiagnosis:
      type: object
      properties:
        run_id: { type: string }
        status: { type: string }
        commit_phase: { type: string }
        commit_age_seconds: { type: number }
        last_classified_error: { type: string }
        task_counts: { type: object, additionalProperties: { type: integer } }
        blocking_tasks: { type: array, items: { type: object } }
        registration: { type: object }
        source_reconciliation:
          type: object
          description: Present only when the run was reconciled against the source.
          properties:
            method: { type: string }
            consistency: { type: string }
            counts:
              type: object
              description: Tasks per status (match, mismatch, indeterminate, error).
              additionalProperties: { type: integer }
            findings:
              type: array
              description: Every task that did not match.
              items: { $ref: "#/components/schemas/SourceReconciliationResult" }
        operator_review_required: { type: boolean }
        suggested_next_action: { type: string }
        generated_at: { type: string }
    Worker:
      type: object
      properties:
        id: { type: string }
        addr: { type: string }
        status: { type: string }
        last_heartbeat: { type: string }
        capabilities_json: { type: object, description: "Free-form: go, os, arch, num_cpu, memory_bytes, ..." }
        instances: { type: array, items: { type: object } }
        running_tasks: { type: integer, description: Tasks this worker currently holds a lease on. }
    DeploymentRequest:
      type: object
      required: [server_id, component]
      properties:
        server_id: { type: string }
        component: { type: string, enum: [master, worker, minio] }
        params:
          type: object
          description: Worker deployments only, except scale which is also worker-only.
          properties:
            scale: { type: integer, minimum: 1, maximum: 50, description: Number of worker containers. }
            name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$", description: "Own Compose project orabbit-worker-<name>; worker IDs <name>-<container id>." }
            cpus: { type: string, example: "1.5", description: CPU limit per container (0.1-64). }
            memory: { type: string, example: 2g, description: Memory limit per container (64m-512g). }
    RunSubmitted:
      type: object
      properties:
        run_id: { type: string }
        job_id: { type: string }
        status: { type: string }
        events_url: { type: string, example: /api/v1/runs/RUN_ID/events }
        run_url: { type: string, example: /api/v1/runs/RUN_ID }
    Run:
      type: object
      description: See README "Errors and run failures" for the failure fields.
      properties:
        id: { type: string }
        job_id: { type: string }
        status: { type: string }
        error_summary: { type: [string, "null"] }
        failure_class: { type: string }
        failure_phase: { type: string, enum: ["", planning, extract, commit] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: run_planning_failed }
            message: { type: string }
            details: { type: object }
            failure_class: { type: string }
            retryable: { type: boolean }
            request_id: { type: string }
