# Weekly update PRs. Minor and patch updates are grouped into one PR per
# ecosystem to keep the noise down; major updates get their own PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /docker/minio]
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
