name: Orabbit - Build & Push

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

env:
  IMAGE: levonghukas/orabbit

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests (race detector)
        run: go test -race ./... -count=1

      - name: Run vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4

  vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fails on reachable vulnerabilities not reviewed in .govulncheck-allow.
      - name: govulncheck
        run: ./scripts/vulncheck.sh

  build-and-push:
    name: Build, scan & push images
    needs: [test, lint, vulncheck]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [master, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags: sha-<short> on every push, <version>/<major>.<minor> on v*.*.*
      # tags, and latest on main. All carry the target as a suffix.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-${{ matrix.target }},onlatest=true
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.orabbit
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: orabbit-scan:${{ matrix.target }}
          cache-from: type=gha,scope=orabbit-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=orabbit-${{ matrix.target }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: orabbit-scan:${{ matrix.target }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.orabbit
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orabbit-${{ matrix.target }}
