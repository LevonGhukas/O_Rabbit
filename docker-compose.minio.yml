name: orabbit-minio

services:
  minio:
    image: ${MINIO_IMAGE:-levonghukas/minio:RELEASE.2025-10-15T17-29-55Z-r1}
    command: server /data --address ":9000" --console-address ":9001"
    env_file:
      - ${ORABBIT_ENV_FILE:-.env.minio}
    ports:
      - "${MINIO_API_PUBLISHED_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLISHED_PORT:-9001}:9001"
    volumes:
      - orabbit_minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: ${MINIO_MC_IMAGE:-levonghukas/mc:RELEASE.2025-08-13T08-35-41Z-r1}
    depends_on:
      minio:
        condition: service_started
    env_file:
      - ${ORABBIT_ENV_FILE:-.env.minio}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
        : "$${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
        : "$${ORABBIT_S3_BUCKET:?set ORABBIT_S3_BUCKET}"

        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb -p "local/$${ORABBIT_S3_BUCKET}" || true
        mc anonymous set none "local/$${ORABBIT_S3_BUCKET}" || true
    restart: "no"

volumes:
  orabbit_minio_data:
