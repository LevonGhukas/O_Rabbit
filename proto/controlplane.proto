syntax = "proto3";

package orabbit.v1;

option go_package = "github.com/LevonGhukas/O_Rabbit/internal/grpcpb;grpcpb";

service ControlPlane {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Pull model: worker asks for work.
  rpc RequestTask(RequestTaskRequest) returns (RequestTaskResponse);

  rpc RenewTaskLease(RenewTaskLeaseRequest) returns (RenewTaskLeaseResponse);

  rpc AcquireUploadCapacity(AcquireUploadCapacityRequest) returns (AcquireUploadCapacityResponse);
  rpc ReleaseUploadCapacity(ReleaseUploadCapacityRequest) returns (ReleaseUploadCapacityResponse);

  rpc ReportTaskProgress(ReportTaskProgressRequest) returns (ReportTaskProgressResponse);
  rpc ReportTaskResult(ReportTaskResultRequest) returns (ReportTaskResultResponse);

  // Worker identity. EnrollWorker is the only RPC accepted without a client
  // certificate; it exchanges a single-purpose enrollment token and a CSR for
  // a master-issued identity certificate. RenewWorkerCertificate requires the
  // current identity certificate.
  rpc EnrollWorker(EnrollWorkerRequest) returns (EnrollWorkerResponse);
  rpc RenewWorkerCertificate(RenewWorkerCertificateRequest) returns (RenewWorkerCertificateResponse);

  // Returns the source and target credentials for one task attempt, only to
  // the authenticated worker that currently holds that attempt's lease.
  rpc GetTaskCredentials(GetTaskCredentialsRequest) returns (GetTaskCredentialsResponse);
  rpc ReportMultipartLifecycle(ReportMultipartLifecycleRequest) returns (ReportMultipartLifecycleResponse);
}

message EnrollWorkerRequest {
  string enrollment_token = 1; // secret; do not log
  string csr_pem = 2;          // PKCS#10 CSR; the private key never leaves the worker
  string name = 3;             // operator-facing label, metadata only
  string hostname = 4;
}

message EnrollWorkerResponse {
  string worker_id = 1;        // server-issued immutable identity (UUID)
  string certificate_pem = 2;
  string ca_certificate_pem = 3;
  int64 not_after_unix_ms = 4;
  string pool = 5;
}

message RenewWorkerCertificateRequest {
  string worker_id = 1;
  string csr_pem = 2;
}

message RenewWorkerCertificateResponse {
  string certificate_pem = 1;
  int64 not_after_unix_ms = 2;
}

message GetTaskCredentialsRequest {
  string worker_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string fencing_token = 4;
  string boot_id = 5;
}

message GetTaskCredentialsResponse {
  string source_dsn = 1;           // do not log
  string s3_access_key_id = 2;     // do not log
  string s3_secret_access_key = 3; // do not log
  string s3_session_token = 4;     // set for temporary (STS) credentials
  int64 s3_expires_at_unix_ms = 5; // 0 when the credentials do not expire
}

message RegisterWorkerRequest {
  string worker_id = 1;           // optional; if empty master assigns
  string addr = 2;                // for observability only
  string capabilities_json = 3;   // opaque
  string boot_id = 4;
  string hostname = 5;
  int32 pid = 6;
  string version = 7;
}

message RegisterWorkerResponse {
  string worker_id = 1;
  int64 heartbeat_interval_ms = 2;
}

message HeartbeatRequest {
  string worker_id = 1;
  int64 now_unix_ms = 2;
  string boot_id = 3;
}

message HeartbeatResponse {}

message RequestTaskRequest {
  string worker_id = 1;
  string capabilities_json = 2;
  // Current value is 6. The master accepts an exact match only. Version 6
  // moved task secrets from TaskAssignment to GetTaskCredentials.
  int32 protocol_version = 3;
  string boot_id = 4;
}

message RequestTaskResponse {
  TaskAssignment task = 1; // if task.task_id is empty, no work
}

message TaskAssignment {
  string task_id = 1;
  string run_id = 2;
  string job_id = 3;
  int32 task_index = 4;
  string correlation_id = 5;
  string attempt_id = 6;
  string fencing_token = 7; // secret ownership credential; do not log
  int32 attempt_number = 8;
  int64 lease_deadline_unix_ms = 9;

  // Planning / partition
  string partition_spec_json = 10;

  // Source. Credentials are never sent here; use GetTaskCredentials.
  string source_engine = 20; // e.g. mssql, postgres
  reserved 21;
  reserved "source_dsn";
  string source_sql = 22;

  // Target (S3/MinIO)
  string s3_endpoint = 30;
  string s3_region = 31;
  string s3_bucket = 32;
  string s3_prefix = 33; // base prefix for output objects
  bool s3_force_path_style = 34;
  reserved 35, 36, 37;
  reserved "s3_access_key_id", "s3_secret_access_key", "s3_session_token";

  // Output controls
  int64 target_file_bytes = 40;

  reserved 41, 42;
  reserved "max_rows_per_file", "fetch_limit_rows";

  repeated string partition_keys = 43;
}

message ReportTaskProgressRequest {
  string worker_id = 1;
  string task_id = 2;
  string run_id = 3;
  string attempt_id = 4;
  string fencing_token = 5;
  string boot_id = 6;

  int64 rows_read = 10;
  int64 bytes_read = 11;
  int64 bytes_written = 12;
  int64 uncompressed_bytes = 13;

  string message = 20;
  string fields_json = 21;
}

message ReportTaskProgressResponse {}

message ReportTaskResultRequest {
  string worker_id = 1;
  string task_id = 2;
  string run_id = 3;
  string attempt_id = 4;
  string fencing_token = 5;
  string boot_id = 6;

  string status = 10;        // SUCCEEDED, FAILED, or CANCELED
  string error_message = 11; // if failed
  string failure_class = 12; // strongly typed classification

  int64 rows_read = 20;
  int64 bytes_read = 21;
  int64 bytes_written = 22;
  int64 uncompressed_bytes = 23;

  repeated string parquet_object_keys = 30;
  string max_hwm_value = 31; // optional, as string
  repeated ArtifactIntegrity artifacts = 32;
}

message ArtifactIntegrity {
  string object_key = 1;
  int64 byte_size = 2;
  string sha256 = 3;
  int64 row_count = 4;
  string schema_fingerprint = 5;
  string run_id = 6;
  string task_id = 7;
  string attempt_id = 8;
  int32 attempt_number = 9;
  int32 file_index = 10;
  int32 format_version = 11;
  string verification_method = 12;
  string verification_status = 13;
  string verified_at = 14;
  string max_hwm = 15;
  // Checksum the object store computed for the uploaded object
  // (x-amz-checksum-sha256): base64 SHA-256 of the whole object, or of the
  // part checksums followed by "-<parts>" for multipart uploads. Empty when
  // the store does not report checksums.
  string provider_checksum_sha256 = 16;
}

message RenewTaskLeaseRequest {
  string worker_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string fencing_token = 4;
  string boot_id = 5;
}

message RenewTaskLeaseResponse {
  int64 lease_deadline_unix_ms = 1;
}

message AcquireUploadCapacityRequest {
  string worker_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string fencing_token = 4;
  string boot_id = 5;
}

message AcquireUploadCapacityResponse {
  bool acquired = 1;
  string lease_id = 2;
  string lease_token = 3; // secret capacity credential; do not log
  int64 lease_deadline_unix_ms = 4;
  int64 retry_after_ms = 5;
}

message ReleaseUploadCapacityRequest {
  string worker_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string lease_id = 4;
  string lease_token = 5; // secret capacity credential; do not log
  string boot_id = 6;
}

message ReleaseUploadCapacityResponse {}

message ReportTaskResultResponse {
  bool accepted = 1;
  string message = 2;
}

message ReportMultipartLifecycleRequest {
  string worker_id = 1;
  string run_id = 2;
  string task_id = 3;
  string attempt_id = 4;
  string fencing_token = 5;
  string boot_id = 6;

  string event = 10;
  int32 file_index = 11;
  string object_key = 12;
  string provider_upload_id = 13;
  string sha256 = 14;
  int64 size = 15;
  string error_class = 16;
  string error_message = 17;
}

message ReportMultipartLifecycleResponse {}