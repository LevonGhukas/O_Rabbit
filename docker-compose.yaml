# Local development stack only. It uses well-known credentials (minioadmin,
# myuser/mypassword, ClickHouse default/default), so every published port is bound to 127.0.0.1. For
# servers use docker-compose.master.yml / docker-compose.worker.yml with
# the .env.*.example files.

x-orabbit-build: &orabbit-build
  context: .
  dockerfile: Dockerfile.orabbit

x-worker-common: &worker-common
  image: orabbit-worker:local
  build:
    <<: *orabbit-build
    target: worker
  depends_on:
    master:
      condition: service_started
    minio-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
  restart: unless-stopped
  environment:
    ORABBIT_WORKER_AUTH_TOKEN: "${ORABBIT_WORKER_AUTH_TOKEN:?set ORABBIT_WORKER_AUTH_TOKEN}"
  networks:
    - orabbit_net

services:
  minio:
    image: levonghukas/minio:RELEASE.2025-10-15T17-29-55Z-r1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - orabbit_net

  minio-init:
    image: levonghukas/mc:RELEASE.2025-08-13T08-35-41Z-r1
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb -p local/bucket1 || true
    restart: "no"
    networks:
      - orabbit_net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - orabbit_net

  ice-rest-catalog:
    image: altinity/ice-rest-catalog:0.11.0
    command: ["-c", "/etc/ice/ice-rest-catalog.yaml"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ice_catalog_data:/var/lib/ice-rest-catalog
      - ./ice-rest-catalog.yaml:/etc/ice/ice-rest-catalog.yaml:ro
    restart: unless-stopped
    networks:
      - orabbit_net

  # Optional query engine over the Iceberg catalog.
  clickhouse:
    image: altinity/clickhouse-server:25.8.9.20207.altinityantalya
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9090:9090"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
    depends_on:
      ice-rest-catalog:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - orabbit_net
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  # Exposes the Ice REST catalog to ClickHouse as the database `ice`.
  clickhouse-init-ice:
    image: altinity/clickhouse-server:25.8.9.20207.altinityantalya
    depends_on:
      clickhouse:
        condition: service_started
    restart: "no"
    entrypoint:
      - /bin/bash
      - -ceu
      - |
        until clickhouse-client --host=clickhouse --password=default --query 'SELECT 1' >/dev/null 2>&1; do sleep 1; done
        clickhouse-client --host=clickhouse --password=default --multiquery "
          SET allow_experimental_database_iceberg = 1;
          CREATE DATABASE IF NOT EXISTS ice
          ENGINE = DataLakeCatalog('http://ice-rest-catalog:5000')
          SETTINGS storage_endpoint = 'http://minio:9000', warehouse = 's3://bucket1';
        "
    networks:
      - orabbit_net

  master:
    image: orabbit-master:local
    build:
      <<: *orabbit-build
      target: master
    command:
      - "-db"
      - "/var/lib/orabbit/master.sqlite"
      - "-http-addr"
      - "0.0.0.0:9100"
      - "-grpc-addr"
      - "0.0.0.0:9102"
      - "-insecure=true"
      # Plaintext gRPC is confined to the private orabbit_net bridge network;
      # 9102 is not published. Use TLS for any cross-host deployment.
      - "-allow-insecure-remote-grpc=true"
      - "-log-level"
      - "INFO"
      - "-log-format"
      - "json"
    environment:
      ORABBIT_HTTP_AUTH_TOKEN: "${ORABBIT_HTTP_AUTH_TOKEN:?set ORABBIT_HTTP_AUTH_TOKEN}"
      ORABBIT_WORKER_AUTH_TOKEN: "${ORABBIT_WORKER_AUTH_TOKEN:?set ORABBIT_WORKER_AUTH_TOKEN}"
      ORABBIT_MASTER_KEY: "${ORABBIT_MASTER_KEY:?set ORABBIT_MASTER_KEY (openssl rand -base64 32)}"
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - master_data:/var/lib/orabbit
    restart: unless-stopped
    networks:
      - orabbit_net

  worker-1:
    <<: *worker-common
    command:
      - "-master"
      - "master:9102"
      - "-worker-id"
      - "docker-worker-1"
      - "-worker-addr"
      - "worker-1"
      - "-insecure=true"
      - "-poll"
      - "2s"

  worker-2:
    <<: *worker-common
    command:
      - "-master"
      - "master:9102"
      - "-worker-id"
      - "docker-worker-2"
      - "-worker-addr"
      - "worker-2"
      - "-insecure=true"
      - "-poll"
      - "2s"

volumes:
  clickhouse_data:
  ice_catalog_data:
  master_data:
  minio_data:
  postgres_data:

networks:
  orabbit_net:
    name: orabbit_net
